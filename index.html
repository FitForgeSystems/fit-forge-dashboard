<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Forge Systems | Master Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(17, 20, 31, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(249, 115, 22, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f97316;
            --accent-hover: #ea580c;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 48px 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        input { width: 100%; padding: 14px; background: rgba(5, 7, 11, 0.6); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
        #error-message { color: #ef4444; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fit Forge Systems</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" id="submitBtn">Sign In</button>
            <div id="error-message"></div>
        </form>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = "https://vogjlzhcaglgyssbpyh.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_eqQBMPOINPhxudVxqhoT9A_EauSQg5g";

        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.handleLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            const btn = document.getElementById('submitBtn');

            errorDiv.style.display = 'none';
            btn.textContent = 'Authenticating...';

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                alert('Success! Logged in as: ' + data.user.email);
            } catch (err) {
                console.error("Detailed Supabase Error:", err);
                errorDiv.textContent = err.message || "Failed to fetch";
                errorDiv.style.display = 'block';
                btn.textContent = 'Sign In';
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
